name: Deploy Suqly to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Application Secrets
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_NAME: ${{ secrets.DB_NAME || 'suqly_prod' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE: ${{ secrets.TWILIO_PHONE }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL || 'noreply@suqly.com' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ~/.ssh

          # Decode base64-encoded SSH key (ensures proper newline handling)
          echo "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Debug: verify key was written correctly
          echo "SSH key size: $(wc -c < ~/.ssh/id_rsa) bytes"
          echo "SSH key first line: $(head -1 ~/.ssh/id_rsa)"
          echo "SSH key last line: $(tail -1 ~/.ssh/id_rsa)"

          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null

          # Copy deploy script and execute with environment variables
          ssh -i ~/.ssh/id_rsa -p $VPS_PORT $VPS_USER@$VPS_HOST "mkdir -p /tmp/suqly"

          scp -P $VPS_PORT scripts/deploy.sh $VPS_USER@$VPS_HOST:/tmp/suqly/

          ssh -i ~/.ssh/id_rsa -p $VPS_PORT $VPS_USER@$VPS_HOST \
            "DB_USER=$DB_USER \
             DB_PASSWORD=$DB_PASSWORD \
             DB_NAME=$DB_NAME \
             JWT_SECRET=$JWT_SECRET \
             OPENSEARCH_PASSWORD=$OPENSEARCH_PASSWORD \
             TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID \
             TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN \
             TWILIO_PHONE=$TWILIO_PHONE \
             SENDGRID_API_KEY=$SENDGRID_API_KEY \
             SENDGRID_FROM_EMAIL=$SENDGRID_FROM_EMAIL \
             STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY \
             STRIPE_PUBLIC_KEY=$STRIPE_PUBLIC_KEY \
             FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID \
             FIREBASE_PRIVATE_KEY=$FIREBASE_PRIVATE_KEY \
             FIREBASE_CLIENT_EMAIL=$FIREBASE_CLIENT_EMAIL \
             SENTRY_DSN=$SENTRY_DSN \
             ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY \
             REGISTRY_USERNAME=$REGISTRY_USERNAME \
             REGISTRY_TOKEN=$REGISTRY_TOKEN \
             bash /tmp/suqly/deploy.sh"

      - name: Health Check
        run: |
          curl -f https://suqly.com/health || exit 1

      - name: Notify Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deployment successful! https://suqly.com'
            })

      - name: Notify Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Deployment failed. Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
