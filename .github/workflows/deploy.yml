name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to ship this main commit to production'
        required: false
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

  test:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: suqly_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Test backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: suqly_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm run test --workspace=backend

      - name: Test frontend
        run: npm run test --workspace=frontend

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are tagged by commit SHA only. Pull requests build but never push,
      # so a PR build can never overwrite what production runs.
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ddotsmedia/suqly/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ddotsmedia/suqly/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Security check
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  # Production deploy: manual only (workflow_dispatch on main, typed confirmation,
  # and approval by a reviewer of the "production" environment).
  # It never runs on push. It deploys only the backend and frontend services,
  # pinned to this commit's SHA, and rolls back to the previous tag if health fails.
  deploy:
    needs: [build, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$VPS_KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          SCP_OPTS=(-i "$HOME/.ssh/deploy_key" -P "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          TARGET="$VPS_USER@$VPS_HOST"

          echo "🔐 Checking SSH access..."
          ssh "${SSH_OPTS[@]}" "$TARGET" 'echo "connected to $(hostname)"'

          echo "📄 Copying the compose file from this commit to the VPS..."
          scp "${SCP_OPTS[@]}" docker-compose.prod.yml "$TARGET:/opt/suqly/docker-compose.prod.new.yml"

          echo "🚀 Deploying image tag $IMAGE_TAG on the VPS..."
          printf '%s' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "$TARGET" "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          ssh "${SSH_OPTS[@]}" "$TARGET" "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/suqly
          COMPOSE="docker compose -f docker-compose.prod.yml"
          export IMAGE_TAG

          PREV_TAG=$(cat .deployed_tag 2>/dev/null || true)
          echo "Previous tag: ${PREV_TAG:-none}"

          # Validate the new file and check prerequisites before changing anything.
          docker compose -f docker-compose.prod.new.yml config -q
          for svc in postgres redis opensearch; do
            if [ -z "$($COMPOSE ps -q --status running "$svc")" ]; then
              echo "❌ $svc is not running. Refusing to deploy."
              exit 1
            fi
          done
          PORT="${BACKEND_HOST_PORT:-3023}"
          if [ -z "$($COMPOSE ps -q --status running backend)" ] && ss -ltn | awk '{print $4}' | grep -qE ":${PORT}\$"; then
            echo "❌ port $PORT is already used by another process. Refusing to deploy."
            exit 1
          fi

          # Keep the previous compose file for reference, then switch to the new one.
          cp -f docker-compose.prod.yml docker-compose.prev.yml 2>/dev/null || true
          mv -f docker-compose.prod.new.yml docker-compose.prod.yml

          # Health is read from Docker itself, not from a host port.
          wait_healthy() {
            for svc in backend frontend; do
              cid=$($COMPOSE ps -q "$svc")
              if [ -z "$cid" ]; then echo "❌ $svc has no container"; return 1; fi
              status=""
              for _ in $(seq 1 45); do
                status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)
                [ "$status" = "healthy" ] && break
                sleep 4
              done
              if [ "$status" != "healthy" ]; then
                echo "❌ $svc is $status after 3 minutes"
                docker logs --tail 40 "$cid" || true
                return 1
              fi
              echo "✅ $svc is healthy"
            done
          }

          rollback() {
            echo "⏪ Rolling back..."
            if [ -n "$PREV_TAG" ]; then
              IMAGE_TAG="$PREV_TAG" $COMPOSE up -d --no-deps --no-build backend frontend || true
            else
              echo "⚠️ No previous tag recorded; nothing to roll back to."
            fi
            exit 1
          }

          if ! ( $COMPOSE pull backend frontend \
                 && $COMPOSE up -d --no-deps --no-build backend frontend \
                 && wait_healthy ); then
            rollback
          fi

          echo "$IMAGE_TAG" > .deployed_tag
          $COMPOSE ps
          echo "✅ Deployment complete: $IMAGE_TAG"
          REMOTE

      # Runs even on failure, so the GHCR token never stays stored on the VPS.
      - name: Log out of ghcr.io on VPS
        if: always()
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          [ -f ~/.ssh/deploy_key ] || exit 0
          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'

      - name: Verify public endpoint
        run: |
          echo "🔍 Verifying https://suqly.com/api/health..."
          sleep 5
          if curl -sf https://suqly.com/api/health > /dev/null; then
            echo "✅ Public health endpoint is accessible"
          else
            echo "⚠️ Could not reach public health endpoint. Check the site manually."
          fi
