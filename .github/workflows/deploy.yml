name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

  test:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: suqly_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Test backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: suqly_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm run test --workspace=backend

      - name: Test frontend
        run: npm run test --workspace=frontend

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/ddotsmedia/suqly/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/ddotsmedia/suqly/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Security check
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  deploy:
    needs: [build, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS with Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "$VPS_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes $VPS_USER@$VPS_HOST"

          echo "🔐 Checking SSH access..."
          $SSH 'echo "connected to $(hostname)"'

          echo "🐳 Logging in to ghcr.io on VPS..."
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          echo "🚀 Deploying on VPS..."
          $SSH 'bash -s' <<'REMOTE'
          set -e
          cd /opt/suqly

          echo "📥 Pulling latest images..."
          docker pull ghcr.io/ddotsmedia/suqly/backend:latest
          docker pull ghcr.io/ddotsmedia/suqly/frontend:latest
          docker-compose -f docker-compose.prod.yml pull

          echo "🛑 Stopping old containers..."
          docker-compose -f docker-compose.prod.yml down

          echo "▶️ Starting P2.7 containers..."
          docker-compose -f docker-compose.prod.yml up -d

          echo "⏳ Waiting for services to be ready..."
          sleep 10

          echo "❓ Checking backend health at http://127.0.0.1:3021/health..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -sf http://127.0.0.1:3021/health > /dev/null; then
              echo "✅ Backend is healthy"
              break
            fi
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️  Health check attempt $attempt/$max_attempts failed, retrying..."
              sleep 2
            fi
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Backend failed to become healthy after $max_attempts attempts"
            exit 1
          fi

          echo "📊 Running containers..."
          docker-compose -f docker-compose.prod.yml ps
          echo "✅ Deployment complete!"
          REMOTE

      - name: Verify public endpoint
        run: |
          echo "🔍 Verifying https://suqly.com/api/health..."
          sleep 5
          if curl -sf https://suqly.com/api/health > /dev/null; then
            echo "✅ Public health endpoint is accessible"
          else
            echo "⚠️ Could not reach public health endpoint, but VPS deployment succeeded"
          fi
