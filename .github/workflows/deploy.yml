name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to ship this main commit to production'
        required: false
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

  test:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: suqly_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Test backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: suqly_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm run test --workspace=backend

      - name: Test frontend
        run: npm run test --workspace=frontend

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are tagged by commit SHA only. Pull requests build but never push,
      # so a PR build can never overwrite what production runs.
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ddotsmedia/suqly/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ddotsmedia/suqly/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm images pushed to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "Build and push completed."
          echo "Docker images to be deployed from ghcr.io:"
          echo "  Backend:  ghcr.io/ddotsmedia/suqly/backend:${{ github.sha }}"
          echo "  Frontend: ghcr.io/ddotsmedia/suqly/frontend:${{ github.sha }}"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"

  security:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Security check
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  # Production deploy: auto-deploys on push to main after build succeeds.
  # Also supports manual deploy via workflow_dispatch with confirmation.
  # Deploys only the backend and frontend services,
  # pinned to this commit's SHA, and rolls back to the previous tag if health fails.
  deploy:
    needs: [build, security]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key from base64
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key && echo "✅ Key is valid" || echo "❌ Key is INVALID"

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key_path: /root/.ssh/deploy_key
          source: docker-compose.prod.yml
          target: /opt/suqly/
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key_path: /root/.ssh/deploy_key
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/suqly
            COMPOSE="docker compose -f docker-compose.prod.yml"

            PREV_TAG=$(cat .deployed_tag 2>/dev/null || true)
            echo "Previous tag: ${PREV_TAG:-none}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null

            wait_healthy() {
              for svc in backend frontend; do
                cid=$($COMPOSE ps -q "$svc")
                if [ -z "$cid" ]; then echo "❌ $svc has no container"; return 1; fi
                status=""
                for _ in $(seq 1 45); do
                  status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)
                  [ "$status" = "healthy" ] && break
                  sleep 4
                done
                if [ "$status" != "healthy" ]; then
                  echo "❌ $svc is $status after 3 min"
                  docker logs --tail 40 "$cid" || true
                  return 1
                fi
                echo "✅ $svc healthy"
              done
            }

            rollback() {
              echo "⏪ Rolling back..."
              if [ -n "$PREV_TAG" ]; then
                IMAGE_TAG="$PREV_TAG" $COMPOSE up -d --no-deps --no-build backend frontend || true
              else
                echo "⚠️ No previous tag; nothing to roll back to."
              fi
              exit 1
            }

            if ! ( $COMPOSE pull backend frontend \
                   && $COMPOSE up -d --no-deps --no-build backend frontend \
                   && wait_healthy ); then
              rollback
            fi

            echo "$IMAGE_TAG" > .deployed_tag
            $COMPOSE ps
            docker logout ghcr.io >/dev/null 2>&1 || true
            echo "✅ Deployment complete: $IMAGE_TAG"

      - name: Verify frontend deployment
        run: |
          echo "Waiting for frontend to stabilize..."
          sleep 10

          echo "Verifying frontend /sell endpoint..."
          if curl -sf https://suqly.com/sell > /dev/null 2>&1; then
            echo "✅ Frontend /sell endpoint is accessible (HTTP 200)"
          else
            RESULT=$(curl -s -w "%{http_code}" -o /dev/null https://suqly.com/sell)
            echo "⚠️ Frontend /sell endpoint returned HTTP $RESULT (expected 200)"
          fi

      - name: Verify public health endpoints
        run: |
          echo "Verifying backend health..."
          if curl -sf https://suqly.com/api/health > /dev/null; then
            echo "✅ Backend health endpoint is accessible"
          else
            echo "⚠️ Could not reach backend health endpoint."
          fi
